site_name: Gobernanza de IA en Málaga
site_url: https://houda-benlemmouden.github.io/malaga-ai-governance/
site_description: Análisis de gobernanza de inteligencia artificial en el sector público de Málaga

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.integrate

nav:
  - Inicio: index.md
  - Estado Actual: current-state.md
  - Análisis de Brechas: gap-analysis.md
  - Marco Normativo: marco-normativo.md
  - Propuesta Metodológica: propuesta.md
  - Plantillas: plantillas.md
  - Sobre Este Proyecto: sobre.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.superfences